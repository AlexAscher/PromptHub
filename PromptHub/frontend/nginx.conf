server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # REST API, файлы и панель PocketBase
    location /api/ {
        proxy_pass https://prompthub-c76s.onrender.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host prompthub-c76s.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 360s;
    }
    location /_/ {
        proxy_pass https://prompthub-c76s.onrender.com;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host prompthub-c76s.onrender.com;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируется: после обновления сайта браузер сразу получает новую версию
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: все остальные адреса отдаются index.html (Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
